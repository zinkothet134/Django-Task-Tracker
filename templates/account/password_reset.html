{% load widget_tweaks %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
    }
    .auth-card {
      border: 0;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
    }
    .form-control {
      border-radius: 14px;
      padding: 12px 14px;
    }
    .btn-main {
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="col-lg-5">
      <div class="card auth-card bg-white">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <h3 class="fw-bold mb-1">Reset Password</h3>
            <p class="text-muted mb-0">Enter your email to receive a reset link.</p>
          </div>

          {% if form.non_field_errors %}
            <div class="alert alert-danger rounded-4">
              {{ form.non_field_errors }}
            </div>
          {% endif %}

          <form method="post" action="{% url 'account_reset_password' %}">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              {{ form.email|add_class:"form-control"|attr:"placeholder:Enter your email" }}
            </div>

            <button type="submit" class="btn btn-primary btn-main w-100">
              <i class="fa-solid fa-paper-plane me-2"></i>Send Reset Link
            </button>
          </form>

          <div class="mt-4 text-center">
            <a href="{% url 'account_login' %}" class="text-decoration-none">Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
