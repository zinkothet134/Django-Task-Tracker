<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center" style="min-height: 80vh;">
    <div class="col-lg-5">
      <div class="card border-0 shadow rounded-4">
        <div class="card-body p-5 text-center">
          <h3 class="fw-bold mb-3">Check your email</h3>
          <p class="text-muted mb-4">We sent you a password reset link. Please check your inbox.</p>
          <a href="{% url 'account_login' %}" class="btn btn-primary rounded-pill px-4">Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
